name: Feature request
description: Propose a change to the client, its documentation or its deployment shape.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is proprietary. A feature request is a proposal, not a promise, and a
        change that is accepted may require a separate written agreement with the copyright
        holder. Please describe the problem before the solution.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the client does not let you do today? Include the task kind, the repository and the constraint.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the client do instead? If it changes a mode, a flag, a default, a refusal or a record field, say which.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What have you tried, and why is it not enough? A service policy change, a narrower rule or a different task kind are all valid answers.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - the loop and leases
        - task kinds and prompts
        - the validator
        - the repository mirror
        - the model runner
        - records and token usage
        - configuration and exit status
        - the container and its posture
        - documentation
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and compatibility
      description: Would this change an existing record, prompt version, mode, exit status or deployment posture? Does it add a dependency or a credential?
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and the documentation.
          required: true
        - label: I have read CONTRIBUTING.md and understand this is a proprietary repository.
          required: true
